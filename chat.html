<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Anggota - ReptilKu</title>
  <style>
    body { background: #0a3d1a; font-family: sans-serif; margin:0; }
    .header { background: #0a3d1a; color:white; padding:15px; text-align:center; }
    #chatBox { background: white; height: 70vh; overflow-y: auto; padding:15px; margin:10px; border-radius:15px; }
    .pesan { margin-bottom:12px; }
    .pesan b { color: #0a3d1a; }
    .input-area { display:flex; padding:10px; background:white; margin:10px; border-radius:30px; }
    .input-area input { flex:1; border:none; outline:none; padding:10px; }
    .input-area button { background:#0a3d1a; color:white; border:none; padding:10px 20px; border-radius:20px; }
  </style>
</head>
<body>
  <div class="header">
    <a href="akun.html" style="color:white; float:left; text-decoration:none;">← Back</a>
    💬 Chat Anggota ReptilKu
  </div>

  <div id="chatBox">Loading chat...</div>

  <div class="input-area">
    <input type="text" id="inputChat" placeholder="Tulis pesan... misal: ada yg jual jangkrik?">
    <button onclick="kirimPesan()">Kirim</button>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDlcdAeCqeIf3FCYoDSGv4g3dnzo6-kkPA",
    authDomain: "reptilku-ff6b0.firebaseapp.com",
    projectId: "reptilku-ff6b0",
    storageBucket: "reptilku-ff6b0.firebasestorage.app",
    messagingSenderId: "1085366860401",
    appId: "1:1085366860401:web:b02bff4cbc6231879679d0"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  let namaSaya = "Mas ais";
  
  // Login anonim biar bisa chat
  signInAnonymously(auth);
  
  onAuthStateChanged(auth, (user) => {
    if(user) loadChat();
  });

  function loadChat() {
    const q = query(collection(db, "chat_global"), orderBy("waktu"));
    onSnapshot(q, (snapshot) => {
      const box = document.getElementById('chatBox');
      box.innerHTML = "";
      snapshot.forEach((doc) => {
        const data = doc.data();
        const jam = data.waktu ? new Date(data.waktu.seconds*1000).toLocaleTimeString() : "baru";
        box.innerHTML += `<div class="pesan"><b>${data.pengirim}</b> <small>(${jam})</small><br>${data.pesan}</div>`;
      });
      box.scrollTop = box.scrollHeight; // auto scroll bawah
    });
  }

  window.kirimPesan = async function() {
    const input = document.getElementById('inputChat');
    if(input.value.trim() == "") return;
    
    await addDoc(collection(db, "chat_global"), {
      pengirim: namaSaya,
      pesan: input.value,
      waktu: serverTimestamp()
    });
    input.value = "";
  }
</script>
</body>
</html>
