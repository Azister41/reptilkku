name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Siapkan folder www
        run: |
          mkdir -p www
          cp index.html www/index.html
      - run: npx cap add android
      - name: Fix Gradle biar gak 504
        run: sed -i "s/8.2.1/8.7/g" android/gradle/wrapper/gradle-wrapper.properties
      - name: Izin notifikasi Android
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $M || sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' $M
      - name: Siapkan ikon dari logo
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y imagemagick
          fi
          if command -v magick >/dev/null 2>&1; then IM=magick; else IM=convert; fi
          mkdir -p assets
          $IM -size 1024x1024 xc:'#173d30' assets/icon-background.png
          $IM logo.png -resize 640x640 -background none -gravity center -extent 1024x1024 assets/icon-foreground.png
          $IM logo.png -resize 640x640 -background '#173d30' -gravity center -extent 1024x1024 -flatten assets/icon-only.png
      - name: Buat ikon aplikasi
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#173d30' --iconBackgroundColorDark '#173d30'
      - run: npx cap sync android
      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: reptilku-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
